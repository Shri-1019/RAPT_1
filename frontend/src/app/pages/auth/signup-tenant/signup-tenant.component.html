<div class="signup-container">
  <!-- Left Side - Form -->
  <div class="form-side">
    <div class="form-wrapper">
      <a routerLink="/auth/signup" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
        <span>Back to role selection</span>
      </a>
      
      <div class="form-header">
        <div class="header-icon tenant-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
            <path d="M3 12h18M12 3v18"/>
            <rect x="4" y="4" width="16" height="16" rx="2"/>
          </svg>
        </div>
        <h1>Create Tenant Account</h1>
        <p>Find your perfect rental home</p>
      </div>
      
      <form (ngSubmit)="onSubmit()">
        <div class="form-row">
          <div class="form-group">
            <label>First Name</label>
            <input 
              type="text" 
              [(ngModel)]="formData().firstName" 
              name="firstName"
              placeholder="Jane">
          </div>
          <div class="form-group">
            <label>Last Name</label>
            <input 
              type="text" 
              [(ngModel)]="formData().lastName" 
              name="lastName"
              placeholder="Smith">
          </div>
        </div>
        
        <div class="form-group">
          <label>Email Address</label>
          <input 
            type="email" 
            [(ngModel)]="formData().email" 
            name="email"
            placeholder="jane@example.com">
        </div>
        
        <div class="form-group">
          <label>Phone Number</label>
          <input 
            type="tel" 
            [(ngModel)]="formData().phone" 
            name="phone"
            placeholder="(555) 123-4567">
        </div>
        
        <div class="form-group">
          <label>Password</label>
          <input 
            type="password" 
            [(ngModel)]="formData().password" 
            name="password"
            placeholder="••••••••">
        </div>
        
        <div class="form-group">
          <label>Confirm Password</label>
          <input 
            type="password" 
            [(ngModel)]="formData().confirmPassword" 
            name="confirmPassword"
            placeholder="••••••••">
        </div>
        
        <app-button variant="primary" size="lg" type="submit">
          Create Account
        </app-button>
      </form>
      
      <div class="signin-prompt">
        <span>Already have an account?</span>
        <a routerLink="/auth/login">Sign In</a>
      </div>
    </div>
  </div>
  
  <!-- Right Side - Info Panel -->
  <div class="info-side tenant-info">
    <div class="info-overlay"></div>
    <div class="info-content">
      <h2>Your rental journey starts here</h2>
      <ul class="feature-list">
        @for (feature of features; track feature) {
          <li>
            <div class="bullet"></div>
            <span>{{ feature }}</span>
          </li>
        }
      </ul>
    </div>
  </div>
</div>
